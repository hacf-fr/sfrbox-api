[project]
name = "sfrbox-api"
version = "0.0.0"
description = "SFR Box API"
authors = [
    { name = "epenet" },
    { name = "HACF", email = "contact@hacf.fr" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
readme = "README.md"
keywords = ["sfrbox", "router"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.9.5",
    "defusedxml>=0.7.1",
    "mashumaro>=3.13.1",
]

[project.optional-dependencies]
cli = [
    "click>=8.0.1",
]

[project.scripts]
sfrbox-api = "sfrbox_api.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/hacf-fr/sfrbox-api"
Repository = "https://github.com/hacf-fr/sfrbox-api"
Documentation = "https://sfrbox-api.readthedocs.io"
Changelog = "https://github.com/hacf-fr/sfrbox-api/releases"

[dependency-groups]
dev = [
    "aiointercept==0.1.12",
    "codespell==2.4.3",
    "covdefaults==2.3.0",
    "coverage[toml]==7.16.2",
    "pre-commit-hooks==6.0.0",
    "prek==0.5.4",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "ty==0.0.84",
    "yamllint==1.38.0",
    "zizmor==1.30.1",
]
# docs (Python >= 3.14)
docs = [
    "furo==2025.12.19; python_version >= '3.14'",
    "myst-parser==5.1.0; python_version >= '3.14'",
    "sphinx==9.1.0; python_version >= '3.14'",
    "sphinx-autobuild==2025.8.25; python_version >= '3.14'",
    "sphinx-click==6.2.0; python_version >= '3.14'",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.codespell]
skip = "node_modules,package-lock.json,uv.lock,tests/fixtures"
# French words in docstrings
ignore-words-list = "adresse,classe,connexion,informations,marge"

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["sfrbox_api", "tests"]

[tool.coverage.covdefaults]
# cli/__main__.py holds the whole CLI entry point, keep measuring it
subtract_omit = "*/__main__.py"

[tool.ty.environment]
python-version = "3.10"

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "A001",    # Variable is shadowing a Python builtin
    "A002",    # Argument is shadowing a Python builtin
    "C400",    # Unnecessary generator
    "E501",    # Line too long (81 > 80)
    "ERA001",  # Found commented-out code
    "N815",    # Variable in class scope should not be mixedCase
    "PLR2004", # Magic value used in comparison, consider replacing
    "PLR0911", # Too many return statements
    "PLR0913", # Too many arguments in function definition
    "PT001",   # Use `@pytest.fixture()` over `@pytest.fixture`
    "PT018",   # Assertion should be broken down into multiple parts
    "PT022",   # No teardown in fixture `cli_runner`, use `return` instead of `yield`
    "PT023",   # Use `@pytest.mark.asyncio()` over `@pytest.mark.asyncio`
    "PLW0127", # Self-assignment of variable
]
select = [
    "A", #flake8-builtins
    "B", #flake8-bugbear
    "C4", #flake8-comprehensions
    "C90", #mccabe
    "E", #pycodestyle error
    "ERA", #eradicate
    "F", #Pyflakes
    "I", #isort
    "N", #pep8-naming
    "PL", #Pylint
    "PT", #flake8-pytest-style
    "RUF100", #unused-noqa
    "UP", #pyupgrade
]

[tool.ruff.lint.isort]
force-single-line = true
known-local-folder = [
    "sfrbox_api",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"
