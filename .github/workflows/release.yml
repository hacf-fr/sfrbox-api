name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  release:
    name: Release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/sfrbox-api
    permissions:
      # Needed to attest the SBOM against the built artifacts
      attestations: write
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14.6"

      - name: Upgrade pip
        run: |
          pip install --constraint=.github/workflows/constraints.txt pip
          pip --version

      - name: Install Poetry
        run: |
          pip install --constraint=.github/workflows/constraints.txt poetry
          poetry --version

      - name: Set package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG,,}"
          version="${version#v}"
          poetry version "${version}"

      - name: Build package
        run: |
          poetry build --ansi

      - name: Locate built wheel
        run: |
          WHEEL_PATH=$(ls dist/sfrbox_api-*-py3-none-any.whl)
          echo "WHEEL_PATH=${WHEEL_PATH}" >> "${GITHUB_ENV}"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: ${{ env.WHEEL_PATH }}
          format: cyclonedx-json
          output-file: sfrbox-api.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM against built artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
          sbom-path: sfrbox-api.cdx.json

      - name: Publish package on PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
          print-hash: true
